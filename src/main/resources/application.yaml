server:
  port: 9090
spring:
  profiles:
    active: dev
  application:
    name: divorce-elquia
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create
      show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
app:
  encryption:
    key: CHANGE_THIS_TO_32_CHAR_KEY